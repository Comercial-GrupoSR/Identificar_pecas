<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Separação de Peças — Obra</title>
<meta name="theme-color" content="#E8590C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F6F2;
    --panel: #FFFFFF;
    --ink: #1B1B18;
    --ink-soft: #6B6B63;
    --line: #E4E1D8;
    --accent: #E8590C;
    --accent-ink: #FFF7F0;
    --ok: #2F9E44;
    --ok-bg: #EBFBEE;
    --bad: #C92A2A;
    --bad-bg: #FFF0F0;
    --pending: #ADB0A6;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,20,15,0.06), 0 6px 20px rgba(20,20,15,0.06);
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom: 40px;
  }
  .topbar{
    position: sticky; top:0; z-index: 20;
    background: var(--ink);
    color: #fff;
    padding: 14px 18px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size: 22px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .brand .tag{
    background: var(--accent);
    color: #fff;
    font-size:11px;
    font-family:'Roboto Mono', monospace;
    font-weight:700;
    padding: 2px 6px;
    border-radius:4px;
    letter-spacing: 0.03em;
  }
  .search-wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 16px 0;
  }
  .mode-tabs{
    display:flex; gap:6px; margin-bottom: 10px;
  }
  .mode-tabs button{
    flex:1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .mode-tabs button.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  form.search{
    display:flex;
    gap:8px;
  }
  .search input[type="text"]{
    flex:1;
    font-family:'Roboto Mono', monospace;
    font-size: 20px;
    font-weight:700;
    letter-spacing: 0.03em;
    padding: 14px 14px;
    border-radius: var(--radius);
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    outline: none;
  }
  .search input[type="text"]:focus{
    border-color: var(--accent);
  }
  .search button{
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 0 20px;
    font-weight:700;
    font-size: 15px;
    cursor:pointer;
  }
  .search button:active{ transform: translateY(1px); }

  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 0;
  }

  .status-line{
    font-size: 13px;
    color: var(--ink-soft);
    padding: 10px 2px 14px;
    min-height: 18px;
  }
  .status-line.err{ color: var(--bad); font-weight:600; }

  .summary{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: 6px 2px 2px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap: wrap;
  }

  .export-btn{
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight:700;
    font-family:'Inter', sans-serif;
    text-transform: none;
    letter-spacing: normal;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    white-space: nowrap;
  }
  .export-btn:active{ opacity: 0.85; }

  .filter-bar{
    display:flex; gap:6px; flex-wrap:wrap;
    margin: 10px 2px 14px;
  }
  .filter-chip{
    background: var(--panel);
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight:700;
    cursor:pointer;
    white-space: nowrap;
  }
  .filter-chip.active{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .filter-chip.active.f-ok{ background: var(--ok); border-color: var(--ok); }
  .filter-chip.active.f-bad{ background: var(--bad); border-color: var(--bad); }
  .filter-chip.active.f-pend{ background: var(--pending); border-color: var(--pending); color:#fff; }

  .cards{ display:flex; flex-direction:column; gap:12px; }

  .card{
    position: relative;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px 16px;
    transition: opacity 0.15s ease;
  }
  .card.busy{ opacity: 0.55; pointer-events:none; }

  .card-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .desc{
    font-size: 15px;
    font-weight:600;
    line-height:1.3;
  }
  .codigo-chip{
    font-family:'Roboto Mono', monospace;
    font-size:12px;
    font-weight:700;
    color: var(--ink-soft);
    background: var(--bg);
    border:1px solid var(--line);
    border-radius: 6px;
    padding: 2px 6px;
    white-space:nowrap;
  }

  .meta-row{
    display:flex; flex-wrap:wrap; gap: 8px 18px;
    margin-top: 10px;
  }
  .meta{
    display:flex; flex-direction:column; gap:1px;
  }
  .meta .k{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight:700;
  }
  .meta .v{
    font-size: 15px;
    font-weight:700;
  }
  .meta.local .v{ color: var(--accent); }
  .meta.qtde .v{ font-family:'Roboto Mono', monospace; }

  .actions{
    display:flex; gap:8px;
    margin-top: 14px;
  }
  .actions button{
    flex:1;
    border-radius: 10px;
    border: 2px solid var(--line);
    background: var(--panel);
    padding: 11px 8px;
    font-size: 13.5px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:6px;
    cursor:pointer;
    color: var(--ink);
  }
  .actions button.ok-btn.active{
    background: var(--ok-bg);
    border-color: var(--ok);
    color: var(--ok);
  }
  .actions button.bad-btn.active{
    background: var(--bad-bg);
    border-color: var(--bad);
    color: var(--bad);
  }
  .actions button:active{ transform: translateY(1px); }

  /* carimbo / stamp */
  .stamp{
    position:absolute;
    top: 14px; right: -34px;
    transform: rotate(28deg);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 40px;
    border-top: 3px solid currentColor;
    border-bottom: 3px solid currentColor;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.2s ease;
  }
  .card.marked-ok .stamp.ok-stamp{ opacity: 0.9; color: var(--ok); }
  .card.marked-bad .stamp.bad-stamp{ opacity: 0.9; color: var(--bad); }
  .card.marked-ok{ border-color: var(--ok); }
  .card.marked-bad{ border-color: var(--bad); }

  .empty{
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 22px 18px;
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .spinner{
    display:inline-block; width:14px; height:14px;
    border:2px solid rgba(0,0,0,0.15); border-top-color: var(--accent);
    border-radius:50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  ::selection{ background: var(--accent); color:#fff; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">Separação <span class="tag">Obra</span></div>
  </div>
  <div class="search-wrap">
    <div class="mode-tabs">
      <button type="button" id="tabCodigo" class="active" data-mode="codigo">Por código</button>
      <button type="button" id="tabRamal" data-mode="ramal">Por ramal</button>
    </div>
    <form class="search" id="formBusca" autocomplete="off">
      <input type="text" id="inputCodigo" inputmode="numeric" placeholder="Digite o código da peça…" autofocus list="ramaisList">
      <button type="submit" id="btnBuscar">Buscar</button>
    </form>
    <datalist id="ramaisList"></datalist>
  </div>
</div>

<main>
  <div class="status-line" id="statusLine"></div>
  <div id="resultArea"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
